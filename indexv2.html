<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell World - Global Evolution</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root { --primary: #00ff88; --bg: #0a0a0c; --glass: rgba(15, 20, 25, 0.7); }
        body { margin: 0; overflow: hidden; background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-user-select: none; }
        canvas { display: block; cursor: default; touch-action: none; /* 禁用瀏覽器預設滑動 */ }
        canvas.playing { cursor: none; }
        
        /* -- 優化版：玻璃擬物化登入介面 -- */
        #menu { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: var(--glass); padding: 40px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); text-align: center; z-index: 10; 
            width: 85%; max-width: 400px; 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        h1 { color: var(--primary); margin-top: 0; letter-spacing: 4px; font-size: clamp(24px, 5vw, 36px); text-shadow: 0 0 10px rgba(0,255,136,0.5); }
        
        .instruction { text-align: left; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; margin-bottom: 25px; font-size: 14px; line-height: 1.8; color: #ccc; border: 1px solid rgba(255,255,255,0.05);}
        .instruction span { color: var(--primary); font-weight: bold; }
        
        input { width: calc(100% - 30px); padding: 15px; font-size: 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: white; margin-bottom: 20px; outline: none; text-align: center; transition: 0.3s;}
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,255,136,0.3); }
        
        button.start-btn { 
            width: 100%; padding: 16px; font-size: 18px; cursor: pointer; 
            background: linear-gradient(135deg, #00aa55, var(--primary)); color: #000; 
            border: none; border-radius: 10px; font-weight: 800; letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button.start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,255,136,0.4); }

        /* --- 遊戲內 UI --- */
        #ui { position: fixed; top: 20px; left: 20px; display: none; pointer-events: none; z-index: 5;}
        .status-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px 4px #000;}
        .status-text span { color: var(--primary); }
        .inventory-slot { display: inline-block; padding: 8px 15px; background: rgba(0,0,0,0.6); border: 1px solid #555; border-radius: 8px; backdrop-filter: blur(5px);}
        
        /* 控制音樂的按鈕 */
        #musicToggle { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--glass); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; z-index: 10; display: none; backdrop-filter: blur(5px);}
        
        /* 排行榜 */
        #leaderboardContainer { position: fixed; right: 20px; top: 20px; display: none; z-index: 5; width: 220px; pointer-events: none;}
        .lb-box { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; backdrop-filter: blur(5px);}
        .lb-header { font-weight:bold; margin-bottom:12px; color:var(--primary); border-bottom:1px solid #444; padding-bottom:8px; text-align: center; font-size: 14px; }
        .lb-entry { margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; text-shadow: 1px 1px 2px #000;}
        
        #deathScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; backdrop-filter: blur(10px);}
        #deathScreen h2 { color: #ff3333; font-size: clamp(36px, 8vw, 64px); text-shadow: 0 0 20px rgba(255,51,51,0.5);}

        /* --- 手機專屬虛擬按鍵 --- */
        #mobile-controls { display: none; position: fixed; bottom: 30px; right: 20px; gap: 15px; z-index: 10; }
        .mob-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(0, 255, 136, 0.15); border: 2px solid var(--primary); color: white; font-weight: bold; font-size: 16px; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); user-select: none; }
        .mob-btn:active { background: rgba(0, 255, 136, 0.5); transform: scale(0.95); }
        
        /* 媒體查詢：當螢幕寬度小於 768px (手機/平板) 時顯示虛擬按鍵，並隱藏部分排版 */
        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            .instruction { font-size: 12px; }
            #leaderboardContainer { display: none !important; /* 手機畫面小，先隱藏排行榜 */ }
        }
    </style>
</head>
<body>

<div id="menu">
    <h1>CELL WORLD</h1>
    <div class="instruction">
        💻 <b>電腦版</b>：<br>
        滑鼠移動 | <span>空白鍵</span>: 分裂 | <span>W</span>: 餵食 | <span>E</span>: 技能<br><br>
        📱 <b>手機版</b>：<br>
        螢幕滑動控制方向 | 右下角按鈕施放技能
    </div>
    <input id="playerName" list="savedNames" placeholder="輸入你的演化代碼..." autocomplete="off" maxlength="12">
    <datalist id="savedNames"></datalist>
    <button class="start-btn" onclick="startGame()">進入全球演化</button>
</div>

<button id="musicToggle" onclick="toggleMusic()">🎵 音樂: 關</button>

<div id="ui">
    <div class="status-text" id="massText">總質量: <span>0</span></div>
    <div style="color:#ddd; font-size: 14px;">武裝：<span id="inventorySlot" class="inventory-slot">空</span></div>
</div>

<div id="mobile-controls">
    <div class="mob-btn" onclick="executeEject(playerId)">餵食<br>(W)</div>
    <div class="mob-btn" onclick="executeSplit(playerId)">分裂<br>(空白)</div>
    <div class="mob-btn" onclick="executePowerUp(playerId)" style="border-color:#00ffff;">技能<br>(E)</div>
</div>

<div id="leaderboardContainer">
    <div class="lb-box">
        <div class="lb-header">📍 區域戰局</div>
        <div id="lb-content"></div>
    </div>
    <div class="lb-box" style="border-color: #ffaa00; box-shadow: 0 0 10px rgba(255,170,0,0.2);">
        <div class="lb-header" style="color: #ffaa00;">🏆 全球名人堂</div>
        <div id="global-lb-content">載入中...</div>
    </div>
</div>

<div id="deathScreen">
    <h2>遭到吞噬</h2>
    <p id="finalScore" style="font-size: 24px; color:#fff; margin-bottom:30px;">最終質量: 0</p>
    <button class="start-btn" style="width: 200px;" onclick="location.reload()">重新開始</button>
</div>

<canvas id="game"></canvas>

<script>
// ==========================================
// 1. FIREBASE 核心配置 (請填入你的金鑰)
// ==========================================
const firebaseConfig = {
    apiKey: "【在此輸入你的 API_KEY】",
    authDomain: "【在此輸入你的 PROJECT_ID】.firebaseapp.com",
    databaseURL: "https://【在此輸入你的 PROJECT_ID】-default-rtdb.firebaseio.com",
    projectId: "【在此輸入你的 PROJECT_ID】",
    storageBucket: "【在此輸入你的 PROJECT_ID】.appspot.com",
    messagingSenderId: "【在此輸入你的 SENDER_ID】",
    appId: "【在此輸入你的 APP_ID】"
};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.database();

// ==========================================
// 2. 音樂與 UI 系統
// ==========================================
const bgm = new Audio('bgm.mp3'); // 讀取同資料夾下的 bgm.mp3
bgm.loop = true;
bgm.volume = 0.4;
let isMusicPlaying = false;

function toggleMusic() {
    let btn = document.getElementById('musicToggle');
    if (isMusicPlaying) {
        bgm.pause();
        btn.innerText = "🎵 音樂: 關";
    } else {
        bgm.play().catch(e => console.log("等待玩家互動"));
        btn.innerText = "🎵 音樂: 開";
    }
    isMusicPlaying = !isMusicPlaying;
}

// ==========================================
// 3. 遊戲變數與控制系統 (兼容手機與電腦)
// ==========================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

const WORLD_SIZE = 8000;
let entities = [], foods = [], powerups = [], playerCells = [];
let remotePlayers = {}; 
let playerId = "player_" + Math.random().toString(36).substr(2, 9);
let mouseX = canvas.width / 2, mouseY = canvas.height / 2;
let camera = { x: WORLD_SIZE/2, y: WORLD_SIZE/2, scale: 1 };
let globalTime = 0, gameRunning = false;

// --- 電腦滑鼠監聽 ---
document.addEventListener("mousemove", e => { mouseX = e.clientX; mouseY = e.clientY; });

// --- 手機觸控監聽 ---
canvas.addEventListener('touchstart', handleTouch, {passive: false});
canvas.addEventListener('touchmove', handleTouch, {passive: false});

function handleTouch(e) {
    if(gameRunning) e.preventDefault(); // 防止畫面跟著手指拉扯滑動
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
}

// ==========================================
// 4. 多人同步與排行榜
// ==========================================
db.ref('players').on('value', (snapshot) => { remotePlayers = snapshot.val() || {}; });

db.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
    let scores = [];
    snapshot.forEach(child => { scores.push(child.val()); });
    scores.reverse();
    let html = scores.map((s, i) => `<div class="lb-entry" style="color:#ddd;"><span>${i+1}. ${s.name}</span><span>${s.score}</span></div>`).join('');
    document.getElementById("global-lb-content").innerHTML = html;
});

// [此處請直接貼上你之前完整的 Class (SpatialHash, Entity, Cell, FoodItem, Virus, PowerUp)]
// [以及 executeEject, executeSplit, executePowerUp 的函式代碼]
// (由於長度限制，請將上一版本的遊戲邏輯類別完美貼回此處)

function syncMyData() {
    if (playerCells.length === 0) return;
    let mainCell = playerCells.sort((a,b) => b.mass - a.mass)[0];
    let totalMass = playerCells.reduce((sum, c) => sum + Math.floor(c.mass), 0);
    db.ref('players/' + playerId).set({ name: mainCell.name, x: Math.floor(mainCell.x), y: Math.floor(mainCell.y), mass: totalMass, color: mainCell.colorStr, lastUpdate: Date.now() });
}

function drawRemotePlayers(ctx) {
    for (let id in remotePlayers) {
        if (id === playerId) continue;
        let rp = remotePlayers[id];
        if (Date.now() - rp.lastUpdate > 3000) continue;
        let r = 15 + Math.pow(rp.mass, 0.45) * 2;
        ctx.save(); ctx.translate(rp.x, rp.y); ctx.globalAlpha = 0.6;
        ctx.fillStyle = rp.color; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ff3333"; ctx.lineWidth = 4; ctx.stroke();
        ctx.globalAlpha = 1.0; ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.font = `bold ${Math.max(14, r * 0.3)}px Arial`; ctx.fillText(rp.name, 0, 0); ctx.restore();
    }
}

function startGame() {
    let nameInput = document.getElementById("playerName").value.trim();
    let name = nameInput || "Cell_" + Math.floor(Math.random()*100);
    
    // 儲存暱稱
    let saved = JSON.parse(localStorage.getItem('cellWorldNames') || '[]');
    if(nameInput && !saved.includes(nameInput)) { saved.unshift(nameInput); localStorage.setItem('cellWorldNames', JSON.stringify(saved.slice(0,5))); }

    db.ref('players/' + playerId).onDisconnect().remove();

    document.getElementById("menu").style.display = "none";
    document.getElementById("ui").style.display = "block";
    document.getElementById("musicToggle").style.display = "block";
    
    // 電腦版才顯示排行榜
    if(window.innerWidth > 768) { document.getElementById("leaderboardContainer").style.display = "block"; }
    
    canvas.classList.add("playing");
    
    // 啟動音樂
    if(!isMusicPlaying) toggleMusic();

    entities = []; foods = []; powerups = []; playerCells = [];
    let p = new Cell(WORLD_SIZE/2, WORLD_SIZE/2, 60, name, playerId, false);
    playerCells.push(p); entities.push(p);
    
    // 生成環境 (請補上你原本的生成迴圈)
    // ...
    
    gameRunning = true;
    requestAnimationFrame(loop);
}

// ... 補上 update(), draw(), loop() 函式 (邏輯與前一版相同) ...

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
</script>
</body>
</html>
